[package]
name = "milkrust-core"
version = "0.1.0"
description = "Core MilkRust preset parser, runtime, compatibility analyzer, and render batch builders"
keywords = ["visualizer", "audio", "wasm", "webgl", "webgpu"]
categories = ["multimedia", "rendering"]
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
gif = { version = "=0.14.2", default-features = false, features = ["raii_no_panic", "std"] }
milkrust-hlsl = { path = "../milkrust-hlsl" }
milkrust-expr = { path = "../milkrust-expr" }
serde_json = "1"

[lints]
workspace = true

