[package]
name = "milkrust-native"
version = "0.1.0"
description = "Thread-affine MilkRust OpenGL renderer and versioned C host ABI"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
milkrust-core = { path = "../milkrust-core" }

# Foreign pointers and OpenGL calls are confined to this boundary crate. The
# parser, evaluator, pack tools and other workspace crates keep unsafe=forbid.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "warn"
