[package]
name = "milkrust-hlsl"
version = "0.1.0"
description = "Bounded legacy HLSL compiler boundary for MilkRust"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
cc = "=1.2.61"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

# This crate alone owns the C ABI. Callers use a safe, bounded API.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
